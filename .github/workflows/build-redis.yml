name: Build portable Redis binaries

# Produces a statically-linked (musl) redis-server + redis-cli that can be
# dropped into any Linux machine's $HOME (e.g. ~/.local/redis) and run
# without root, a package manager, or a compiler present at runtime.
#
# Rationale: build once on a throwaway musl (Alpine) environment, ship the
# resulting binaries as a workflow artifact. A static musl build avoids the
# glibc-version compatibility problems a dynamically linked binary built on
# one distro can hit when run on an older one.

on:
  workflow_dispatch:
    inputs:
      redis_version:
        description: 'Redis version to build (e.g. "7.4.2"), or "stable" for the latest stable release'
        required: false
        default: 'stable'
  workflow_call:
    inputs:
      redis_version:
        description: 'Redis version to build (e.g. "7.4.2"), or "stable" for the latest stable release'
        required: false
        default: 'stable'
        type: string

jobs:
  build-static-redis:
    name: Build static redis-server (musl)
    runs-on: ubuntu-latest
    container:
      image: alpine:3.20

    steps:
      - name: Install build dependencies
        run: apk add --no-cache build-base linux-headers wget tar

      - name: Download Redis source
        env:
          REDIS_VERSION: ${{ inputs.redis_version || 'stable' }}
        run: |
          set -eu
          if [ "$REDIS_VERSION" = "stable" ]; then
            url="https://download.redis.io/redis-stable.tar.gz"
          else
            url="https://download.redis.io/releases/redis-${REDIS_VERSION}.tar.gz"
          fi
          echo "Downloading $url"
          wget -O redis.tar.gz "$url"
          mkdir -p redis-src
          tar -xzf redis.tar.gz --strip-components=1 -C redis-src

      - name: Build static binaries
        working-directory: redis-src
        run: |
          set -eu
          # src/Makefile records each invocation's FINAL_CFLAGS/FINAL_LDFLAGS
          # in .make-settings, and re-runs `distclean` + a full deps rebuild
          # (persist-settings, see src/Makefile) the moment those flags differ
          # from the previous invocation's. A "build normally, then force a
          # static re-link" two-phase approach changes LDFLAGS between the two
          # make calls, so the second call wipes and rebuilds everything the
          # first call already produced - including bundled deps
          # (hiredis/lua/xxhash/tre/...) via a Makefile line that swallows
          # that rebuild's exit code (a leading `-`), so a real failure in any
          # one dep only surfaces later as a missing ../deps/<name>/lib*.a at
          # final link. That's what caused the "cannot find ...libtre.a"
          # failures seen here - not a -j race.
          #
          # Fix: build with the final flags from the very start, in one
          # invocation, so persist-settings only ever runs once (the
          # unavoidable first-run trigger, since no .make-settings exists
          # yet) - and un-swallow that one recipe line first, so if a dep
          # genuinely fails to build, we see gcc/ld's real error instead of a
          # downstream "missing .a".
          sed -i \
            's|^\(\t\)-(cd \.\./deps \&\& \$(MAKE) \$(DEPENDENCY_TARGETS)|\1(cd ../deps \&\& $(MAKE) $(DEPENDENCY_TARGETS)|' \
            src/Makefile

          # xxhash's default `lib` target (deps/Makefile) builds BOTH
          # libxxhash.a (static) and libxxhash.so (shared) - and our
          # LDFLAGS=-static leaks into that recursive sub-make and breaks the
          # shared-object half (ld: "can not be used when making a shared
          # object"), the same -static/-shared conflict as tests/modules, one
          # dependency deeper. We only need the static libxxhash.a that
          # src/Makefile links against, so build that specific target instead
          # of the combined `lib`.
          sed -i \
            's|cd xxhash \&\& \$(MAKE) lib CFLAGS=|cd xxhash \&\& $(MAKE) libxxhash.a CFLAGS=|' \
            deps/Makefile

          # Target redis-server/redis-cli directly (not `all`) so this never
          # touches tests/modules (which would conflict with LDFLAGS=-static,
          # since those build as `.so`) or the bundled Redis Stack extension
          # modules under modules/ (which need readies tooling we don't have
          # and don't need).
          make -C src MALLOC=libc BUILD_TLS=no LDFLAGS="-static" redis-server redis-cli

      - name: Verify static linking
        working-directory: redis-src/src
        run: |
          set -eu
          file redis-server
          # Check file(1)'s own verdict rather than piping through ldd: musl's
          # ldd doesn't reliably print glibc's "not a dynamic executable"
          # wording for a static binary, so grepping its output is fragile.
          file redis-server | grep -q "statically linked"

      - name: Smoke test
        working-directory: redis-src/src
        run: |
          set -eu
          ./redis-server --port 16379 --daemonize no &
          server_pid=$!
          sleep 1
          ./redis-cli -p 16379 ping
          kill "$server_pid"

      - name: Stage binaries
        run: |
          set -eu
          mkdir -p dist
          cp redis-src/src/redis-server dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: redis-static-musl-linux-x86_64
          path: dist/
          retention-days: 90
