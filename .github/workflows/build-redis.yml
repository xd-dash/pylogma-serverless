name: Build portable Redis binaries

# Produces a statically-linked (musl) redis-server + redis-cli that can be
# dropped into any Linux machine's $HOME (e.g. ~/.local/redis) and run
# without root, a package manager, or a compiler present at runtime.
#
# Rationale: build once on a throwaway musl (Alpine) environment, ship the
# resulting binaries as a workflow artifact. A static musl build avoids the
# glibc-version compatibility problems a dynamically linked binary built on
# one distro can hit when run on an older one.

on:
  workflow_dispatch:
    inputs:
      redis_version:
        description: 'Redis version to build (e.g. "7.4.2"), or "stable" for the latest stable release'
        required: false
        default: 'stable'
  workflow_call:
    inputs:
      redis_version:
        description: 'Redis version to build (e.g. "7.4.2"), or "stable" for the latest stable release'
        required: false
        default: 'stable'
        type: string

jobs:
  build-static-redis:
    name: Build static redis-server (musl)
    runs-on: ubuntu-latest
    container:
      image: alpine:3.20

    steps:
      - name: Install build dependencies
        run: apk add --no-cache build-base linux-headers wget tar

      - name: Download Redis source
        env:
          REDIS_VERSION: ${{ inputs.redis_version || 'stable' }}
        run: |
          set -eu
          if [ "$REDIS_VERSION" = "stable" ]; then
            url="https://download.redis.io/redis-stable.tar.gz"
          else
            url="https://download.redis.io/releases/redis-${REDIS_VERSION}.tar.gz"
          fi
          echo "Downloading $url"
          wget -O redis.tar.gz "$url"
          mkdir -p redis-src
          tar -xzf redis.tar.gz --strip-components=1 -C redis-src

      - name: Build static binaries
        working-directory: redis-src
        run: |
          set -eu
          # Bundled deps (hiredis, lua, xxhash, tre, ...) are only built by the
          # ROOT Makefile's `all`/`build` recipe (it builds deps, then `cd src
          # && make all`) - src/Makefile's own `all` does NOT build them on
          # its own, so scoping to `make -C src all` skips deps entirely and
          # fails on whichever `.a` it needs first. So this has to go through
          # the root `all`.
          #
          # The root `all`/`build` recipe also tries to build the bundled
          # Redis Stack extension modules under modules/ (redisbloom,
          # redisearch, redisjson, redistimeseries), which need their own
          # `readies` build tooling we don't have and don't need - that step
          # fails and makes the overall command exit non-zero, but by then
          # deps + redis-server + redis-cli are already built successfully.
          # So tolerate this command's exit code and verify the actual
          # binary we need instead.
          #
          # Deliberately no -j here: this recipe builds deps via a recursive
          # $(MAKE) before linking redis-server, and under -j the final link
          # can race ahead of that sub-make finishing (seen intermittently as
          # "cannot find ../deps/tre/libtre.a" - same command, same input,
          # different outcome between runs). Running serially makes deps
          # resolution deterministic.
          make MALLOC=libc BUILD_TLS=no all || true
          test -f src/redis-server

          # Now force a static re-link of just the two binaries we need. All
          # deps and object files already exist at this point, so this only
          # relinks - it doesn't touch tests/modules (avoiding the `-static`
          # + `-shared` conflict from a bare `LDFLAGS=-static all`), and it
          # doesn't need to rebuild any deps.
          rm -f src/redis-server src/redis-cli
          make -C src MALLOC=libc BUILD_TLS=no LDFLAGS="-static" redis-server redis-cli

      - name: Verify static linking
        working-directory: redis-src/src
        run: |
          set -eu
          file redis-server
          # A truly static binary reports "not a dynamic executable".
          ldd redis-server 2>&1 | grep -q "not a dynamic executable"

      - name: Smoke test
        working-directory: redis-src/src
        run: |
          set -eu
          ./redis-server --port 16379 --daemonize no &
          server_pid=$!
          sleep 1
          ./redis-cli -p 16379 ping
          kill "$server_pid"

      - name: Stage binaries
        run: |
          set -eu
          mkdir -p dist
          cp redis-src/src/redis-server dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: redis-static-musl-linux-x86_64
          path: dist/
          retention-days: 90
